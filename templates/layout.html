<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}KiraKiraNook{% endblock %}</title>
</head>
<body>
    <header>
        <div class="wrap">
            <a class="logo" href="/" aria-label="KiraKiraNook">
            <span class="kira" aria-hidden="true">
                <i>K</i><i>I</i><i>R</i><i>A</i>
                <i>K</i><i>I</i><i>R</i><i>A</i>
            </span>
            <span class="nook" aria-hidden="true">Nook</span>
            </a>
            <button class="lang" id="lang" aria-label="Switch language">EN</button>
        </div>
    </header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>© 2026 KiraKiraNook</footer>

<script>
(
function(){
var lang="ja",btn=document.getElementById("lang");
function apply(){
document.documentElement.lang=lang;
document.querySelectorAll("[data-ja]").forEach(function(el){el.innerHTML=el.getAttribute("data-"+lang)});
btn.textContent=lang==="ja"?"EN":"日本語";
document.title=lang==="ja"?"KiraKiraNook | お子さまの作品を、一冊の本に":"KiraKiraNook | Turn your child’s art into a book";
}
btn.addEventListener("click",function(){lang=lang==="ja"?"en":"ja";apply()});
})();
</script>
</body>
</html>
